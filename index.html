<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0f11">
<link rel="apple-touch-icon" href="m_logo_180.png">
<link rel="icon" type="image/png" href="m_logo_180.png">
<title>Hybrid Train</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0e0f11;
    --surface: #161719;
    --surface2: #1e2024;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0ede8;
    --muted: #7a7870;
    --accent: #c8f050;
    --cardio: #50c8f0;
    --rest: #7a7870;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    flex-shrink: 0;
    padding: calc(var(--safe-top) + 14px) 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.6rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .logo span { color: var(--accent); }

  .week-switcher { display: flex; gap: 4px; align-items: center; }

  .week-lbl {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 2px;
  }

  .week-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
    min-height: 36px;
  }
  .week-btn.active { background: var(--accent); color: #0e0f11; border-color: var(--accent); }

  /* DAY NAV */
  .day-nav {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    padding: 10px 12px 0;
  }

  .day-pill {
    cursor: pointer;
    padding: 8px 2px 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    text-align: center;
    border-radius: 6px;
    transition: border-color 0.15s;
    user-select: none;
    min-height: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .day-pill:active { opacity: 0.65; }
  .day-pill.active { border-color: var(--accent); }
  .day-pill.active .pill-dot { background: var(--accent); }
  .day-pill.type-cardio.active { border-color: var(--cardio); }
  .day-pill.type-cardio.active .pill-dot { background: var(--cardio); }
  .day-pill.type-rest.active { border-color: var(--rest); }
  .day-pill.type-rest.active .pill-dot { background: var(--rest); }

  .pill-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }

  .pill-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text);
    display: block;
    line-height: 1.15;
  }

  .pill-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--border2);
    margin-top: 4px;
    transition: background 0.15s;
  }

  /* SCROLL AREA */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 14px calc(var(--safe-bottom) + 16px);
  }

  .day-content { display: none; }
  .day-content.visible { display: block; animation: fadeUp 0.25s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* CONTENT HEADER */
  .content-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .content-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 0.95;
  }

  .content-header h2 .hl { color: var(--accent); }
  .content-header h2 .hl-blue { color: var(--cardio); }
  .content-header h2 .hl-gray { color: var(--muted); }

  .meta-block { text-align: right; flex-shrink: 0; }

  .meta-duration {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
  }
  .meta-duration.blue { color: var(--cardio); }
  .meta-duration.gray { color: var(--muted); }

  .meta-lbl {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-top: 1px;
  }

  .meta-note {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.4;
    max-width: 140px;
    text-align: right;
  }

  /* SECTIONS */
  .section { margin-bottom: 16px; }

  .section-title {
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* EXERCISE ROWS */
  .exercise-list { display: flex; flex-direction: column; gap: 1px; }

  .ex-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 14px;
    background: var(--surface);
    min-height: 52px;
  }
  .ex-row:first-child { border-radius: 6px 6px 0 0; }
  .ex-row:last-child { border-radius: 0 0 6px 6px; }
  .ex-row:only-child { border-radius: 6px; }
  .ex-row:active { background: var(--surface2); }

  .ex-name { font-size: 0.9rem; color: var(--text); line-height: 1.3; }

  .ex-detail {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ex-detail.blue { color: var(--cardio); }
  .ex-detail.gray { color: var(--muted); }

  /* TIP */
  .tip {
    margin-top: 16px;
    padding: 13px 14px;
    border-left: 2px solid var(--accent);
    background: rgba(200,240,80,0.04);
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.6;
    border-radius: 0 6px 6px 0;
  }
  .tip.blue { border-color: var(--cardio); background: rgba(80,200,240,0.04); }
  .tip.gray { border-color: var(--rest); background: rgba(122,120,112,0.04); }
  .tip strong { color: var(--text); font-weight: 500; }

  /* REST CARDS */
  .rest-grid { display: flex; flex-direction: column; gap: 1px; }

  .rest-card {
    background: var(--surface);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 64px;
  }
  .rest-card:first-child { border-radius: 6px 6px 0 0; }
  .rest-card:last-child { border-radius: 0 0 6px 6px; }

  .rest-icon { font-size: 1.4rem; width: 36px; text-align: center; flex-shrink: 0; }
  .rest-text-title { font-size: 0.9rem; font-weight: 500; color: var(--text); }
  .rest-text-desc { font-size: 0.78rem; color: var(--muted); margin-top: 2px; line-height: 1.4; }

  /* STAT CHIPS */
  .stats-row { display: flex; gap: 6px; margin-top: 20px; flex-wrap: wrap; }

  .stat-chip {
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 10px;
    white-space: nowrap;
  }
  .stat-chip span { color: var(--accent); font-weight: 500; }

  /* SET CHECKBOXES */
  .sets-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .set-box {
    width: 36px; height: 36px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    transition: all 0.15s;
    user-select: none;
    flex-shrink: 0;
  }
  .set-box:active { transform: scale(0.92); }
  .set-box.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0f11;
  }
  .set-box.done.cardio {
    background: var(--cardio);
    border-color: var(--cardio);
  }

  .sets-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 10px;
    margin-bottom: 4px;
    display: block;
  }

  /* REST TIMER OVERLAY */
  .timer-overlay {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0e0f11;
    border-top: 1px solid var(--border2);
    padding: 16px 20px calc(var(--safe-bottom) + 16px);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .timer-overlay.visible { transform: translateY(0); }

  .timer-ring-wrap {
    flex-shrink: 0;
    position: relative;
    width: 56px; height: 56px;
  }

  .timer-ring-wrap svg {
    position: absolute; top: 0; left: 0;
    transform: rotate(-90deg);
  }

  .timer-ring-bg { fill: none; stroke: var(--surface2); stroke-width: 3; }
  .timer-ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  .timer-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .timer-info { flex: 1; }
  .timer-title {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .timer-exercise {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .timer-next {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .timer-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .timer-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted);
    min-height: 40px;
  }

  .timer-btn.skip {
    background: var(--accent);
    color: #0e0f11;
    border-color: var(--accent);
  }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    height: 2px;
    background: var(--border);
    margin-bottom: 16px;
    border-radius: 1px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 0.3s ease;
  }
  .progress-bar-fill.blue { background: var(--cardio); }

  /* EXERCISE CARD (detailed) */
  .ex-card {
    background: var(--surface);
    margin-bottom: 1px;
    padding: 14px;
  }
  .ex-card:first-child { border-radius: 6px 6px 0 0; }
  .ex-card:last-child { border-radius: 0 0 6px 6px; margin-bottom: 0; }
  .ex-card:only-child { border-radius: 6px; }

  .ex-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .ex-card-left {}
  .ex-card-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .ex-card-name {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .ex-card-alt {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .ex-card-stats {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .stat-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--surface2);
    border-radius: 6px;
    padding: 5px 8px;
    min-width: 44px;
  }
  .stat-pill-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat-pill-val.blue { color: var(--cardio); }
  .stat-pill-lbl {
    font-size: 0.58rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  .ex-focus {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  .focus-tag {
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 7px;
    line-height: 1.3;
  }
</style>
</head>

    }
  },
  {
    id:'sun', name:'Sun', label:'Rest', type:'rest',
    title:['Full','Rest'], duration:'—', meta:'Recovery · Light walk or stretching only',
    rest: true,
    restCards:[
      {icon:'😴', title:'Sleep', desc:'Prioritise sleep Fri–Sun to absorb the week\'s load'},
      {icon:'🚶', title:'Light walk', desc:'10–20 min easy walk if you want to move'},
      {icon:'🧘', title:'Stretching', desc:'Hips, thoracic spine, calves — nothing intense'},
    ],
    tip:'<strong>3 strength + 2–3 cardio sessions is solid weekly volume.</strong> Full rest Sunday means you start Monday\'s ride properly recovered.'
  },
];

// ── STATE ──────────────────────────────────────────────
let activeDay = 'mon';
let satMode = 'ride';
let checkedSets = {}; // key: "dayId-exIdx-setIdx"

// ── TIMER STATE ────────────────────────────────────────
let timerInterval = null;
let timerTotal = 0;
let timerRemaining = 0;
let timerExName = '';
let timerNextName = '';
const CIRCUMFERENCE = 150.8;

function parseRestSeconds(restStr) {
  if (!restStr) return 90;
  const s = restStr.toLowerCase();
  if (s.includes('2 min')) return 120;
  if (s.includes('90')) return 90;
  if (s.includes('60–90') || s.includes('60-90')) return 75;
  if (s.includes('45–60') || s.includes('45-60')) return 52;
  if (s.includes('60')) return 60;
  if (s.includes('45')) return 45;
  return 90;
}

function startTimer(seconds, exName, nextName) {
  clearInterval(timerInterval);
  timerTotal = seconds;
  timerRemaining = seconds;
  timerExName = exName;
  timerNextName = nextName;

  document.getElementById('timerExName').textContent = exName;
  document.getElementById('timerNextUp').textContent = nextName ? '↓ ' + nextName + ' next' : '';
  document.getElementById('timerOverlay').classList.add('visible');
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) finishTimer();
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  document.getElementById('timerDisplay').textContent =
    m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${timerRemaining}s`;
  const pct = timerTotal > 0 ? timerRemaining / timerTotal : 0;
  document.getElementById('timerRing').style.strokeDashoffset =
    CIRCUMFERENCE * (1 - pct);
}

function finishTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
  document.getElementById('timerOverlay').classList.remove('visible');
}

function cancelTimer() { finishTimer(); }
function skipTimer() { finishTimer(); }

// ── CHECKBOX LOGIC ─────────────────────────────────────
function toggleSet(dayId, exIdx, setIdx, totalSets, restSecs, exName, nextExName) {
  const key = `${dayId}-${exIdx}-${setIdx}`;
  const wasChecked = checkedSets[key];

  if (wasChecked) {
    delete checkedSets[key];
    clearInterval(timerInterval);
    document.getElementById('timerOverlay').classList.remove('visible');
  } else {
    checkedSets[key] = true;
    // Start rest timer — last set starts shorter timer
    const isLastSet = setIdx === totalSets - 1;
    const secs = isLastSet ? Math.round(restSecs * 0.5) : restSecs;
    const label = exName + (isLastSet ? ' (last set)' : ` · Set ${setIdx + 1}`);
    startTimer(secs, label, isLastSet ? nextExName : '');
  }
  rerenderSets(dayId, exIdx);
}

function rerenderSets(dayId, exIdx) {
  const el = document.querySelector(`[data-sets-key="${dayId}-${exIdx}"]`);
  if (!el) return;
  const total = parseInt(el.dataset.total);
  const restSecs = parseInt(el.dataset.rest);
  const exName = el.dataset.exname;
  const nextName = el.dataset.nextname;
  const isCardio = el.dataset.cardio === 'true';
  el.innerHTML = renderSetsHTML(dayId, exIdx, total, restSecs, exName, nextName, isCardio);
}

function renderSetsHTML(dayId, exIdx, total, restSecs, exName, nextName, isCardio) {
  let html = '';
  for (let i = 0; i < total; i++) {
    const key = `${dayId}-${exIdx}-${i}`;
    const done = !!checkedSets[key];
    const cardioClass = isCardio ? ' cardio' : '';
    html += `<div class="set-box${done ? ' done' + cardioClass : ''}"
      onclick="toggleSet('${dayId}',${exIdx},${i},${total},${restSecs},'${exName.replace(/'/g,"\\'")}','${nextName.replace(/'/g,"\\'")}')">
      ${done ? '✓' : i + 1}
    </div>`;
  }
  return html;
}

function maxSets(setsStr) {
  const m = setsStr.match(/(\d+)/g);
  return m ? parseInt(m[m.length - 1]) : 3;
}

// ── RENDER ─────────────────────────────────────────────
function ac(type) { return type==='cardio'||type==='optional'?'blue':type==='rest'?'gray':''; }
function hl(type) { return type==='cardio'||type==='optional'?'hl-blue':type==='rest'?'hl-gray':'hl'; }

function completedCount(dayId, exercises) {
  if (!exercises) return { done: 0, total: 0 };
  let done = 0, total = 0;
  exercises.forEach((e, i) => {
    const n = maxSets(e.sets);
    total += n;
    for (let s = 0; s < n; s++) {
      if (checkedSets[`${dayId}-${i}-${s}`]) done++;
    }
  });
  return { done, total };
}

function renderExercises(d, a) {
  if (d.exercises) {
    const isCardio = a === 'blue';
    return `<div class="exercise-list">${d.exercises.map((e, exIdx) => {
      const total = maxSets(e.sets);
      const restSecs = parseRestSeconds(e.rest);
      const nextName = exIdx < d.exercises.length - 1 ? d.exercises[exIdx+1].name : '';
      return `<div class="ex-card">
        <div class="ex-card-header">
          <div class="ex-card-left">
            <div class="ex-card-num">Exercise ${e.num}</div>
            <div class="ex-card-name">${e.name}</div>
            ${e.alt ? `<div class="ex-card-alt">${e.alt}</div>` : ''}
          </div>
          <div class="ex-card-stats">
            <div class="stat-pill">
              <span class="stat-pill-val ${a}">${e.sets}</span>
              <span class="stat-pill-lbl">sets</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-val ${a}">${e.reps}</span>
              <span class="stat-pill-lbl">reps</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-val gray">${e.rest}</span>
              <span class="stat-pill-lbl">rest</span>
            </div>
          </div>
        </div>
        <div class="ex-focus">${e.focus.map(f=>`<span class="focus-tag">${f}</span>`).join('')}</div>
        <span class="sets-label">Tap to log set · timer auto-starts</span>
        <div class="sets-row"
          data-sets-key="${d.id}-${exIdx}"
          data-total="${total}"
          data-rest="${restSecs}"
          data-exname="${e.name}"
          data-nextname="${nextName}"
          data-cardio="${isCardio}">
          ${renderSetsHTML(d.id, exIdx, total, restSecs, e.name, nextName, isCardio)}
        </div>
      </div>`;
    }).join('')}</div>`;
  }
  return d.sections.map(s=>`
    <div class="section">
      <div class="section-title">${s.title}</div>
      <div class="exercise-list">${s.exercises.map(e=>`
        <div class="ex-row">
          <span class="ex-name">${e.name}</span>
          <span class="ex-detail ${a}">${e.detail}</span>
        </div>`).join('')}</div>
    </div>`).join('');
}

function btnStyle(active, color) {
  return `font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:7px 12px;border:1px solid ${active?color:'var(--border2)'};background:${active?color:'transparent'};color:${active?'#0e0f11':'var(--muted)'};border-radius:4px;cursor:pointer;min-height:36px;`;
}

function renderNav() {
  document.getElementById('dayNav').innerHTML = days.map(d=>`
    <div class="day-pill type-${d.type==='optional'?'cardio':d.type}${d.id===activeDay?' active':''}" onclick="setDay('${d.id}')">
      <span class="pill-name">${d.name}</span>
      <span class="pill-label">${d.label}</span>
      <div class="pill-dot"></div>
    </div>`).join('');
}

function renderMain() {
  const d = days.find(x=>x.id===activeDay)||days[0];
  const a = ac(d.type), h = hl(d.type);
  let title = d.title, duration = d.duration, meta = d.meta, tip = d.tip;
  let body = '', exercises = null;

  if (d.rest) {
    body = `<div class="rest-grid">${d.restCards.map(c=>`
      <div class="rest-card">
        <div class="rest-icon">${c.icon}</div>
        <div><div class="rest-text-title">${c.title}</div><div class="rest-text-desc">${c.desc}</div></div>
      </div>`).join('')}</div>`;
  } else if (d.satData) {
    const sd = d.satData[satMode];
    title = sd.title; duration = sd.duration; meta = sd.meta; tip = sd.tip;
    const toggle = `<div style="display:flex;gap:6px;margin-bottom:16px;align-items:center;flex-wrap:wrap;">
      <span style="font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-right:2px;">Today</span>
      <button onclick="setSatMode('ride')" style="${btnStyle(satMode==='ride','var(--cardio)')}">Bike</button>
      <button onclick="setSatMode('run')" style="${btnStyle(satMode==='run','var(--cardio)')}">Run</button>
      <button onclick="setSatMode('rest')" style="${btnStyle(satMode==='rest','var(--rest)')}">Rest</button>
    </div>`;
    body = toggle + renderExercises(sd, a);
  } else {
    exercises = d.exercises || null;
    body = renderExercises(d, a);
  }

  // Progress bar for strength days
  let progressHTML = '';
  if (exercises) {
    const { done, total } = completedCount(d.id, exercises);
    const pct = total > 0 ? (done / total) * 100 : 0;
    progressHTML = `<div class="progress-bar-wrap"><div class="progress-bar-fill${a==='blue'?' blue':''}" style="width:${pct}%"></div></div>`;
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="day-content visible">
      <div class="content-header">
        <h2><span class="${h}">${title[0]}</span><br>${title[1]}</h2>
        <div class="meta-block">
          <div class="meta-duration ${a}">${duration}</div>
          <span class="meta-lbl">minutes</span>
          <div class="meta-note">${meta}</div>
        </div>
      </div>
      ${progressHTML}
      ${body}
      <div class="tip ${a}">${tip}</div>
      <div class="stats-row">
        <div class="stat-chip">Protein <span>1.6–2.2 g/kg</span></div>
        <div class="stat-chip">Sleep <span>7–9 hrs</span></div>
        <div class="stat-chip">Deload <span>every 6–8 wks</span></div>
      </div>
    </div>`;
}

// ── AUTO TODAY ─────────────────────────────────────────
function autoToday() {
  const map = ['sun','mon','tue','wed','thu','fri','sat'];
  const todayId = map[new Date().getDay()];
  if (days.find(d => d.id === todayId)) activeDay = todayId;
}

function setDay(id) {
  activeDay = id;
  cancelTimer();
  renderAll();
}
function setSatMode(m) { satMode = m; renderAll(); }

function renderAll() { renderNav(); renderMain(); }

window.setDay = setDay;
window.setSatMode = setSatMode;
window.toggleSet = toggleSet;
window.cancelTimer = cancelTimer;
window.skipTimer = skipTimer;

autoToday();
renderAll();
</script>
<!-- REST TIMER OVERLAY -->
<div class="timer-overlay" id="timerOverlay">
  <div class="timer-ring-wrap">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle class="timer-ring-bg" cx="28" cy="28" r="24"/>
      <circle class="timer-ring-progress" id="timerRing" cx="28" cy="28" r="24"
        stroke-dasharray="150.8" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-center" id="timerDisplay">—</div>
  </div>
  <div class="timer-info">
    <div class="timer-title">Rest timer</div>
    <div class="timer-exercise" id="timerExName">—</div>
    <div class="timer-next" id="timerNextUp"></div>
  </div>
  <div class="timer-actions">
    <button class="timer-btn" onclick="cancelTimer()">Cancel</button>
    <button class="timer-btn skip" onclick="skipTimer()">Skip</button>
  </div>
</div>


</html>
